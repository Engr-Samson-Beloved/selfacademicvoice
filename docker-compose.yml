services:
  api:
    build:
      context: .
      # Kept out of the repo root: Pxxl detects a root Dockerfile and replays
      # its RUN lines outside a real Docker context, which breaks the deploy.
      dockerfile: deploy/Dockerfile
    image: selfacademicvoice:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
    volumes:
      # Rewritten documents survive a container restart. Remove this if you do
      # not want submitted or rewritten documents persisted on the host.
      - ./data/rewritten:/app/data/rewritten
    restart: unless-stopped
    healthcheck:
      # Uses the image's own Python; curl is deliberately not installed.
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Do not add `deploy.replicas` or extra uvicorn workers: job state is
    # in-process, so a poll routed to a different replica 404s. See Dockerfile.
