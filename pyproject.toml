[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwriter"
version = "1.1.0"
description = "Rewrites documents in an author's voice, measured from that author's own corpus"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "groq>=0.18.0,<1.0",
    "google-genai>=1.0.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "python-docx>=1.1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=3.0.0,<7.0",
]

[project.optional-dependencies]
rag = ["chromadb>=0.5.0,<2.0", "sentence-transformers>=3.0.0,<6.0"]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[project.scripts]
voiceprofile = "ghostwriter.voiceprofile:main"

[tool.setuptools.packages.find]
include = ["ghostwriter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
