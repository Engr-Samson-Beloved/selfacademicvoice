[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ghostwriter"
version = "1.0.0"
description = "AI ghostwriting assistant that rewrites text in an author's voice"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "groq>=0.18.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["ghostwriter*"]
